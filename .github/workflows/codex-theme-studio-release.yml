name: Release Codex Theme Studio

on:
  push:
    tags:
      - "codex-theme-studio-v*"

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: apps/codex-theme-studio

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install legacy bridge toolchain
        run: choco install innosetup --no-progress -y

      - name: Resolve release version
        run: |
          $version = '${{ github.ref_name }}'.Replace('codex-theme-studio-v', '')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Theme Studio release tag has an invalid version.' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Minisign release key
        env:
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
        run: |
          if (-not $env:MINISIGN_SECRET_KEY_BASE64) { throw 'MINISIGN_SECRET_KEY_BASE64 is required for public releases.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'codex-theme-studio-minisign.key'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:MINISIGN_SECRET_KEY_BASE64))
          "MINISIGN_SECRET_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build MSI and legacy bridge installer
        run: |
          .\scripts\build-windows-installer.ps1 `
            -AppVersion $env:RELEASE_VERSION `
            -GitHubRepository '${{ github.repository }}' `
            -UpdateReleaseTag 'codex-theme-studio-latest' `
            -SignMode None

      - name: Sign updater artifact and create manifest
        run: |
          .\scripts\new-update-manifest.ps1 `
            -Version $env:RELEASE_VERSION `
            -Repository '${{ github.repository }}' `
            -ReleaseTagPrefix 'codex-theme-studio-v' `
            -InstallerPath ".\dist\Codex-Theme-Studio-$env:RELEASE_VERSION-Windows-x64.msi" `
            -BridgeInstallerPath ".\dist\Codex-Theme-Studio-Setup-$env:RELEASE_VERSION.exe" `
            -SecretKeyPath $env:MINISIGN_SECRET_KEY_PATH `
            -Notes "Codex Theme Studio $env:RELEASE_VERSION"
          .\scripts\test-update-signature.ps1 -AppVersion $env:RELEASE_VERSION

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "codex-theme-studio-v$env:RELEASE_VERSION" `
            ".\dist\Codex-Theme-Studio-$env:RELEASE_VERSION-Windows-x64.msi" `
            ".\dist\Codex-Theme-Studio-$env:RELEASE_VERSION-Windows-x64.msi.minisig" `
            ".\dist\Codex-Theme-Studio-Setup-$env:RELEASE_VERSION.exe" `
            ".\dist\Codex-Theme-Studio-Setup-$env:RELEASE_VERSION.exe.minisig" `
            ".\dist\latest.json" `
            --title "Codex Theme Studio $env:RELEASE_VERSION" `
            --generate-notes

      - name: Update rolling channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view codex-theme-studio-latest 2>$null) {
            gh release upload codex-theme-studio-latest ".\dist\latest.json" --clobber
            gh release edit codex-theme-studio-latest --title 'Codex Theme Studio Update Channel'
          } else {
            gh release create codex-theme-studio-latest ".\dist\latest.json" `
              --title 'Codex Theme Studio Update Channel' `
              --notes 'Machine-readable rolling update channel. Download the installer from the versioned release.' `
              --prerelease
          }

      - name: Remove release key
        if: always()
        run: |
          if ($env:MINISIGN_SECRET_KEY_PATH -and (Test-Path -LiteralPath $env:MINISIGN_SECRET_KEY_PATH)) {
            [IO.File]::Delete($env:MINISIGN_SECRET_KEY_PATH)
          }
