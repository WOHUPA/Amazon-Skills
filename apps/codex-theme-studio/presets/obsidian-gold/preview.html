<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>曜石鎏金 · Codex Theme Studio</title><style>
:root{--accent:#D7AE55;--accent-ink:#000000;--canvas:#080807;--surface:#171510;--raised:#242016;--text:#FFF8E7;--muted:#C7B993;--border:#5B4C27;--menu:#12100C;--panel:#18150E;--composer:#201B11;--radius:12px;--panel-alpha:0.62;}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 Inter,'Segoe UI',sans-serif;background:linear-gradient(rgb(0 0 0/0.10),rgb(0 0 0/0.10)),url('assets/home-background.jpg'),var(--canvas);background-size:cover;background-position:70% 40%}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}aside{padding:22px 16px;border-right:1px solid var(--border);background:color-mix(in srgb,var(--menu) calc(var(--panel-alpha)*100%),transparent)}main{padding:40px}.content{max-width:920px;margin:auto}nav{display:grid;gap:8px;margin-top:28px}nav div,.card,.composer{border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in srgb,var(--panel) calc(var(--panel-alpha)*100%),transparent);box-shadow:0 12px 40px rgb(0 0 0/.12)}nav div{padding:10px 12px}nav img{width:18px;vertical-align:-4px;margin-right:9px}h1{font-size:42px;margin:18vh 0 10px}.muted{color:var(--muted)}.badge{color:var(--accent)}.card{padding:22px;margin-top:28px}.composer{padding:15px 16px;margin-top:18px;display:flex;justify-content:space-between}button{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--accent-ink)}
